[project]
name = "ai-search-analyzer"
version = "1.0.0"
description = "Analyze how visible a website is to AI search engines and LLMs"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
]

[project.scripts]
ai-search-analyzer = "ai_search_analyzer.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
